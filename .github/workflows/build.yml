name: Build
on:
  push:
    branches:
      - development
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # This adds your manual "Run workflow" button!
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B clean package -DskipTests -Denforcer.skip=true
      - name: Upload Finished Jar
        uses: actions/upload-artifact@v4
        with:
          name: CoreProtect-Jar
          path: target/CoreProtect-*.jar
